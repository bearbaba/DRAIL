name: local-invariants
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q contracts
      - run: python -m pytest -q tests/test_local_contract.py
  genvm-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This job must NOT be silently skipped: SDK compatibility is a gate.
      - run: python -m pip install genvm-linter==0.11.0 genlayer-test==0.29.2
      - run: genvm-lint check contracts/drail.py
      - run: genvm-lint check contracts/consumer_fixture.py
      # GenLayer DirectVM SDK currently expects the legacy artifact name.
      # Reuse the bundle previously downloaded and validated by genvm-linter.
      - name: Reuse validated runner bundle for DirectVM
        run: |
          mkdir -p ~/.cache/gltest-direct
          cp -n ~/.cache/genvm-linter/genvm-universal-*.tar.xz ~/.cache/gltest-direct/
          ls -lh ~/.cache/gltest-direct/
      - run: python -m pytest -q tests/test_direct_genvm.py
