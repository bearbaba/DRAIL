name: studionet-smoke
on:
  push:
    branches: [fix/security-hardening-v1]
  workflow_dispatch:
jobs:
  studionet:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[studionet-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRAIL_AUTHORITY_URL: https://raw.githubusercontent.com/bearbaba/DRAIL/fix/security-hardening-v1/examples/policy_v1.txt
      DRAIL_AGENT_ADDRESS: '0x3333333333333333333333333333333333333333'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install genlayer-test==0.29.2
      - run: gltest --network studionet studionet/test_live.py -v -s
